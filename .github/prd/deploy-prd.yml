name: Deploy produção (MTG)

# ATENCAO: este arquivo NAO roda no repo de dev. A cada merge na main o
# promote.yml de la copia o snapshot do codigo pro repo de producao (pipeline-databricks-mtg-prd) e poe
# este arquivo em .github/workflows/deploy-prd.yml. Ele fica versionado no dev
# porque o desenho dos jobs de prod passa pela mesma revisao que o codigo.
#
# Os jobs de prod leem o codigo DO REPO DE PRODUCAO, nunca do de dev: la o dev
# tem liberdade de apagar tag, dar force-push, ate apagar o repo, e nada disso
# pode derrubar producao. O que roda aqui so muda por uma promocao.

on:
  repository_dispatch:
    types: [deploy-prd]
  # Redeployar uma tag antiga por aqui e o rollback.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag deste repo a deployar (ex.: prd-20261001-0930-ccae429)"
        required: true

# Dois deploys de prod simultaneos deixariam metade dos jobs numa tag e
# metade noutra. Nao cancela o que ja esta rodando: um deploy pela metade e
# pior que um deploy velho.
concurrency:
  group: deploy-prd
  cancel-in-progress: false

env:
  # Este proprio repo: o codigo chega aqui pela promocao, nao e lido do dev.
  CODE_REPO: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Environment separado do de dev: outros secrets. Sem required reviewer:
    # o merge na main ja e a decisao de publicar.
    environment: Databricks-Prod

    steps:
      - name: Resolver a tag alvo
        id: alvo
        run: echo "tag=${{ github.event.client_payload.tag || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Checkout do código na tag promovida
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CODE_REPO }}
          ref: ${{ steps.alvo.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Dependencias vem do codigo publicado, num arquivo so com o CI de dev.
      - name: Instalar dependências
        run: pip install -r .github/requirements-ci.txt

      # CLI nova (binario Go) pinada na mesma versao do repo de codigo.
      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@v1.16.1

      # Ja passou no CI de dev, mas producao revalida o que de fato chegou
      # aqui - inclusive num rollback pra uma tag antiga.
      - name: Revalidar o código promovido
        run: |
          python .github/scripts/validate_dag.py
          python .github/scripts/lint_notebooks.py
          python -m pytest src .github/scripts -q

      - name: Deploy dos jobs de produção
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          # Knobs do deploy: mexem no job, nao chegam no cluster.
          MTG_JOB_SUFFIX: "_PRD"
          MTG_GIT_URL: "https://github.com/${{ env.CODE_REPO }}"
          MTG_GIT_TAG: ${{ steps.alvo.outputs.tag }}
          MTG_PAUSE_STATUS: "UNPAUSED"
          # Destino do on_failure injetado em todo job. Sem isso a run mensal
          # de producao falha as 6h da segunda e ninguem fica sabendo.
          MTG_ALERT_EMAIL: ${{ vars.MTG_ALERT_EMAIL }}
          # Config do ambiente: o deploy.py injeta tudo que comeca com MTG_ e
          # nao e knob em spark_env_vars, e get_secret() no notebook resolve
          # env var > secret > default. Por isso NAO existe scope de prd: o
          # scope "mtg-pipeline" guarda o que e igual nos dois ambientes
          # (bucket, URL da API, retries) e o que difere esta aqui, versionado.
          MTG_ENVIRONMENT: "production"
          MTG_CATALOG_NAME: "mtg_prod"
          # O ambiente ja esta no bucket, nao nos prefixos: dev grava em
          # s3://magicthegatheringdev/dev/{stage,bronze,silver,gold} e o
          # storage root do mtg_prod e .../prd, coberto pela external location
          # mtg-uc-location-prd. Trocar so o bucket mantem os prefixos iguais
          # nos dois ambientes e cai dentro do que o UC concedeu.
          MTG_S3_BUCKET: "s3://magicthegatheringdev/prd"
        run: python .github/scripts/deploy.py

      # O passo que faltava: sobe um cluster com a config de prd, confere que
      # MTG_CATALOG_NAME chegou de verdade no spark_env_vars, grava e le no
      # mtg_prod e cria os schemas do medalhao. Ate existir, "producao
      # deployada" queria dizer so "as settings do job estao certas".
      - name: Smoke test em produção
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MTG_JOB_SUFFIX: "_PRD"
          MTG_GIT_URL: "https://github.com/${{ env.CODE_REPO }}"
          MTG_GIT_TAG: ${{ steps.alvo.outputs.tag }}
          MTG_ENVIRONMENT: "production"
          MTG_CATALOG_NAME: "mtg_prod"
          MTG_S3_BUCKET: "s3://magicthegatheringdev/prd"
        run: python .github/scripts/smoke.py

      - name: Resumo
        run: |
          {
            echo "## Produção atualizada"
            echo ""
            echo "- Tag: \`${{ steps.alvo.outputs.tag }}\`"
            echo "- Código: \`${{ env.CODE_REPO }}\`"
            echo "- Jobs: MTG_STAGE_PRD, MTG_BRONZE_PRD, MTG_SILVER_PRD, MTG_GOLD_PRD, MTG_PIPELINE_PRD"
            echo "- Catálogo: \`mtg_prod\` · S3 \`s3://magicthegatheringdev/prd\`"
            echo "- Smoke test: cluster subiu e gravou no \`mtg_prod\`"
            echo "- Alerta de falha: \`${MTG_ALERT_EMAIL:-NÃO CONFIGURADO}\`"
          } >> "$GITHUB_STEP_SUMMARY"
