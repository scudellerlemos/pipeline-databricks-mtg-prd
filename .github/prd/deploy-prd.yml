name: Deploy produção (MTG)

# Este arquivo NAO roda no repo de dev. O promote.yml copia o codigo pro repo
# de producao (pipeline-databricks-mtg-prd) e coloca este arquivo em
# .github/workflows/deploy-prd.yml de la. Fica versionado aqui pra ser revisado junto com o codigo.
#
# Os jobs de prod leem o codigo do repo de producao, nunca do de dev: o que
# roda em prod so muda por uma promocao.

on:
  repository_dispatch:
    types: [deploy-prd]
  # Redeployar uma tag antiga por aqui e o rollback.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag deste repo a deployar (ex.: prd-20261001-0930-ccae429)"
        required: true
      rodar:
        description: "Rodar o MTG_PIPELINE_PRD depois do deploy"
        type: boolean
        default: false

# Um deploy por vez, sem cancelar o que esta rodando: deploy interrompido
# deixa parte dos jobs numa tag e parte noutra.
concurrency:
  group: deploy-prd
  cancel-in-progress: false

env:
  # O proprio repo de producao (o codigo chega pela promocao).
  CODE_REPO: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Environment proprio (secrets de prd). Sem required reviewer: o merge na main
    # ja e a decisao de publicar (ADR-007).
    environment: Databricks-Prod

    steps:
      - name: Resolver a tag alvo
        id: alvo
        run: echo "tag=${{ github.event.client_payload.tag || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Checkout do código na tag promovida
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CODE_REPO }}
          ref: ${{ steps.alvo.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Mesmo arquivo de dependencias do CI de dev.
      - name: Instalar dependências
        run: pip install -r .github/requirements-ci.txt

      # CLI nova (binario Go), mesma versao do CI de dev.
      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@v1.16.1

      # Revalida o codigo da tag, inclusive em rollback pra uma tag antiga.
      - name: Revalidar o código promovido
        run: |
          python .github/scripts/validate_dag.py
          python .github/scripts/lint_notebooks.py
          python -m pytest src .github/scripts -q

      - name: Deploy dos jobs de produção
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          # Configuram o job; nao vao pro cluster.
          MTG_JOB_SUFFIX: "_PRD"
          MTG_GIT_URL: "https://github.com/${{ env.CODE_REPO }}"
          MTG_GIT_TAG: ${{ steps.alvo.outputs.tag }}
          MTG_PAUSE_STATUS: "UNPAUSED"
          # Email do alerta on_failure de todos os jobs.
          MTG_ALERT_EMAIL: ${{ vars.MTG_ALERT_EMAIL }}
          # Config do ambiente: vai pro spark_env_vars e obter_segredo() prioriza
          # env var sobre o secret scope. Nao ha scope de prd: o "mtg-pipeline"
          # tem a config de dev e o que prd sobrescreve fica aqui.
          MTG_ENVIRONMENT: "production"
          MTG_CATALOG_NAME: "mtg_prod"
          # O ambiente fica no caminho do bucket (.../dev ou .../prd); os prefixos
          # de camada sao iguais. .../prd e coberto pela external location mtg-uc-location-prd.
          MTG_S3_BUCKET: "s3://magicthegatheringdev/prd"
        run: python .github/scripts/deploy.py

      # Sobe um cluster com a config de prd, confere MTG_CATALOG_NAME no cluster,
      # grava e le no mtg_prod e cria os schemas do medalhao.
      - name: Smoke test em produção
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MTG_JOB_SUFFIX: "_PRD"
          MTG_GIT_URL: "https://github.com/${{ env.CODE_REPO }}"
          MTG_GIT_TAG: ${{ steps.alvo.outputs.tag }}
          MTG_ENVIRONMENT: "production"
          MTG_CATALOG_NAME: "mtg_prod"
          MTG_S3_BUCKET: "s3://magicthegatheringdev/prd"
        run: python .github/scripts/smoke.py

      - name: Resumo
        env:
          MTG_ALERT_EMAIL: ${{ vars.MTG_ALERT_EMAIL }}
        run: |
          {
            echo "## Produção atualizada"
            echo ""
            echo "- Tag: \`${{ steps.alvo.outputs.tag }}\`"
            echo "- Código: \`${{ env.CODE_REPO }}\`"
            echo "- Jobs: MTG_STAGE_PRD, MTG_BRONZE_PRD, MTG_SILVER_PRD, MTG_GOLD_PRD, MTG_PIPELINE_PRD"
            echo "- Catálogo: \`mtg_prod\` · S3 \`s3://magicthegatheringdev/prd\`"
            echo "- Smoke test: cluster subiu e gravou no \`mtg_prod\`"
            echo "- Alerta de falha: \`${MTG_ALERT_EMAIL:-NÃO CONFIGURADO}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Opcional: reprocessa na hora em vez de esperar a carga mensal (Silver faz
      # MERGE com dedup, nao duplica). --no-wait: falha chega pelo email de alerta do job.
      - name: Rodar o pipeline em produção
        if: github.event.client_payload.rodar == true || inputs.rodar == true
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          JOB=$(databricks jobs list --name MTG_PIPELINE_PRD -o json | jq -r '.[0].job_id')
          RUN=$(databricks jobs run-now "$JOB" --no-wait -o json | jq -r .run_id)
          echo "MTG_PIPELINE_PRD disparado: run $RUN"
          echo "- Pipeline disparado: run \`$RUN\`" >> "$GITHUB_STEP_SUMMARY"
