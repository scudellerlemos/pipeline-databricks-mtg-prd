resources:
  jobs:
    # Orquestrador: Stage -> Bronze -> Silver -> Gold, cada camada so depois da
    # anterior terminar. Cada run_job_task e so um marcador: o deploy troca pelas
    # tasks do YAML da camada, todas num cluster so (deploy.embutir_camadas).
    # Com run_job_task de verdade cada camada subia o proprio cluster (~115s cada).
    MTG_PIPELINE:
      name: MTG_PIPELINE
      description: "Orquestrador: Stage -> Bronze -> Silver -> Gold"
      # Run normal leva ~20min; 4h indica travamento. Sem timeout o run fica
      # RUNNING indefinidamente e o alerta on_failure nunca dispara.
      timeout_seconds: 14400
      schedule:
        # 1a segunda-feira do mes, as 6h (Quartz "2#1" = 1a ocorrencia da segunda)
        quartz_cron_expression: "0 0 6 ? * 2#1"
        timezone_id: America/Sao_Paulo
        # PAUSED por padrao: so producao agenda (sobe com MTG_PAUSE_STATUS=UNPAUSED).
        # Dev roda sob demanda, pra nao chamar o Scryfall duas vezes pelo mesmo dado.
        pause_status: PAUSED
      tasks:
        - task_key: rodar_stage
          # Unica task com retry: depende do Scryfall, onde erro transitorio (503)
          # e comum. Nas outras camadas erro e bug ou DQ, retry nao ajuda.
          max_retries: 2
          min_retry_interval_millis: 300000
          run_job_task:
            job_id: "{{MTG_STAGE_JOB_ID}}"

        - task_key: rodar_bronze
          depends_on:
            - task_key: rodar_stage
          run_job_task:
            job_id: "{{MTG_BRONZE_JOB_ID}}"

        - task_key: rodar_silver
          depends_on:
            - task_key: rodar_bronze
          run_job_task:
            job_id: "{{MTG_SILVER_JOB_ID}}"

        - task_key: rodar_gold
          depends_on:
            - task_key: rodar_silver
          run_job_task:
            job_id: "{{MTG_GOLD_JOB_ID}}"

      tags:
        project: "MTG"
        environment: "development"
        team: "data-engineering"
        api_source: "scryfall"
        layer: "orquestrador"
