resources:
  jobs:
    MTG_BRONZE:
      name: MTG_BRONZE
      description: "Camada Bronze - EL puro da Stage (S3/Parquet) para Delta"
      # Tasks independentes, rodam em paralelo. A ordem Stage -> Bronze fica
      # com o orquestrador (MTG_PIPELINE).
      tasks:
        - task_key: bronze_cartas
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/cards
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_colecao
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/sets
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_precos
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/card_prices
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_simbologia
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/symbology
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_regras
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/rulings
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_migracoes
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/migrations
            source: GIT
          job_cluster_key: Job_cluster

      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            # Pool mtg-pipeline-pool-dbr154: runtime 15.4 pre-carregado. Com
            # min_idle_instances=0, fora dos 10 min de idle a instancia e provisionada na hora.
            instance_pool_id: "0925-163505-peep89-pool-mgfqrcwi"
            driver_instance_pool_id: "0925-163505-peep89-pool-mgfqrcwi"
            # Autoscale: workers acompanham a carga das 6 tasks em paralelo.
            autoscale:
              min_workers: 1
              max_workers: 2
            spark_env_vars:
              PYSPARK_PYTHON: "/databricks/python3/bin/python3"
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"

      git_source:
        git_url: "https://github.com/scudellerlemos/pipeline-databricks-mtg-dev"
        git_provider: "gitHub"
        git_branch: "main"

      tags:
        project: "MTG"
        environment: "development"
        team: "data-engineering"
        api_source: "scryfall"
        layer: "bronze"
