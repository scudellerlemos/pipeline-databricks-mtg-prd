resources:
  jobs:
    # Job proprio: so roda depois que a Silver termina inteira, controlado
    # pelo orquestrador (MTG_PIPELINE).
    MTG_GOLD:
      name: MTG_GOLD
      description: "Camada Gold do pipeline de Magic: The Gathering"
      tasks:
        - task_key: gold_mercado_cartas
          notebook_task:
            notebook_path: src/04 - Gold/Dev/TB_FATO_MERCADO_CARTAS
            source: GIT
          job_cluster_key: Job_cluster

      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            # Instance pool mtg-pipeline-pool-dbr154: o runtime 15.4 ja vem
            # pre-carregado (preloaded_spark_versions), o cluster nao instala o
            # Spark ao subir. min_idle_instances=0: fora da janela de 10 min de
            # idle a instancia on-demand ainda e provisionada na hora.
            instance_pool_id: "0925-163505-peep89-pool-mgfqrcwi"
            driver_instance_pool_id: "0925-163505-peep89-pool-mgfqrcwi"
            autoscale:
              min_workers: 1
              max_workers: 2
            spark_env_vars:
              PYSPARK_PYTHON: "/databricks/python3/bin/python3"
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"

      git_source:
        git_url: "https://github.com/scudellerlemos/pipeline-databricks-mtg-dev"
        git_provider: "gitHub"
        git_branch: "main"

      tags:
        project: "MTG"
        environment: "development"
        team: "data-engineering"
        api_source: "scryfall"
        layer: "gold"
