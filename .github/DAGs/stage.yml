resources:
  jobs:
    MTG_STAGE:
      name: MTG_STAGE
      description: "Camada Stage - ingestao da API Scryfall para S3/Parquet"
      # Tasks independentes, rodam em paralelo.
      tasks:
        - task_key: stage_precos
          notebook_task:
            notebook_path: src/01 - Ingestion/card_prices
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_cartas
          notebook_task:
            notebook_path: src/01 - Ingestion/cards
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_regras
          notebook_task:
            notebook_path: src/01 - Ingestion/rulings
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_colecao
          notebook_task:
            notebook_path: src/01 - Ingestion/sets
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_migracoes
          notebook_task:
            notebook_path: src/01 - Ingestion/migrations
            source: GIT
          job_cluster_key: Job_cluster

      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            # Single-node: o gargalo medido era o driver (CPU 80-99%, swap ate 85%)
            # com os workers ociosos. m5d.2xlarge = 8 vCPU / 32 GB, tudo no driver.
            # Sem instance pool: com min_idle 0 ele nao reaproveitava instancia entre
            # camadas (setup de ~200s em todas no run de 27/09).
            node_type_id: "m5d.2xlarge"
            num_workers: 0
            # Explicito: sem isso o single-node sobe sem modo de acesso (sem Unity
            # Catalog) e le o S3 anonimo -> 403. Multi-node caia em SINGLE_USER sozinho.
            data_security_mode: "SINGLE_USER"
            aws_attributes:
              availability: "ON_DEMAND"
              zone_id: "us-west-2a"
            custom_tags:
              ResourceClass: "SingleNode"
            spark_env_vars:
              PYSPARK_PYTHON: "/databricks/python3/bin/python3"
            spark_conf:
              spark.master: "local[*]"
              spark.databricks.cluster.profile: "singleNode"
              spark.databricks.delta.preview.enabled: "true"
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"

      git_source:
        git_url: "https://github.com/scudellerlemos/pipeline-databricks-mtg-dev"
        git_provider: "gitHub"
        git_branch: "main"

      tags:
        project: "MTG"
        environment: "development"
        team: "data-engineering"
        api_source: "scryfall"
        layer: "stage"
